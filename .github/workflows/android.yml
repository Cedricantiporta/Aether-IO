name: Android APK

on:
  push:
    branches: [claude/festive-shannon-tspv5k, claude/charming-shannon-nq5wcd, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21   # Capacitor 7 requires JDK 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'   # default 'tools' package no longer exists in the SDK repo
      - name: Build web + sync Capacitor
        run: npm run build:android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aether-survivor-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
      - name: Publish APK as a GitHub Release (dev branch builds)
        if: github.ref == 'refs/heads/claude/charming-shannon-nq5wcd'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Aether Survivor APK (build ${{ github.run_number }})
          body: Debug APK built automatically from the latest commit. Download the .apk below and install it on Android (allow installs from unknown sources).
          make_latest: true
          files: android/app/build/outputs/apk/debug/*.apk
